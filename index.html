<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" href="assets/icons/logo.png">
    <title>TaskFlow</title>
</head>

<body>
    <aside class="aside">
        <div class="aside__header">
            <img src="assets/icons/checkbox.png" alt="" class="checkbox-img">
            <h3 class="aside__heading">
                TaskFlow
            </h3>
        </div>
        <ul class="aside__task-list">
            <li class="task-list__wrapper">
                <div class="task-list__element">
                    <img src="assets/icons/list.png" alt="" class="task-list__img">
                    <h4 class="task-list__title">
                        Все задачи
                    </h4>
                </div>
            </li>
            <li class="task-list__wrapper">
                <div class="task-list__element">
                    <img src="assets/icons/progress.png" alt="" class="task-list__img">
                    <h4 class="task-list__title">
                        К выполнению
                    </h4>
                </div>
            </li>
            <li class="task-list__wrapper">
                <div class="task-list__element">
                    <img src="assets/icons/clock.png" alt="" class="task-list__img">
                    <h4 class="task-list__title">
                        В работе
                    </h4>
                </div>
            </li>
            <li class="task-list__wrapper">
                <div class="task-list__element">
                    <img src="assets/icons/done.png" alt="" class="task-list__img done">
                    <h4 class="task-list__title">
                        Готово
                    </h4>
                </div>
            </li>
        </ul>
        <article class="between">
        </article>
        <ul class="aside__priorities-list">
            <li class="priorities-list__wrapper">
                <div class="priorities-list__element">
                    <h4 class="priorities-list__title">
                        Приоритеты
                    </h4>
                </div>
            </li>
            <li class="priorities-list__wrapper">
                <div class="priorities-list__element">
                    <span class="priorities-list__color orange">

                    </span>
                    <h4 class="priorities-list__title">
                        Высокий
                    </h4>
                </div>
            </li>
            <li class="priorities-list__wrapper">
                <div class="priorities-list__element">
                    <span class="priorities-list__color yellow">

                    </span>
                    <h4 class="priorities-list__title">
                        Средний
                    </h4>
                </div>
            </li>
            <li class="priorities-list__wrapper">
                <div class="priorities-list__element">
                    <span class="priorities-list__color green">

                    </span>
                    <h4 class="priorities-list__title">
                        Низкий
                    </h4>
                </div>
            </li>
        </ul>
    </aside>
    <main class="main">
        <header class="main__header">

        </header>
    </main>
    <script src="scripts/app.js"></script>
</body>

</html>
